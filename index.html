<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Kalinga · Division Medical-Dental & Nutrition Information System</title>
  <meta name="description" content="DepEd Schools Division Medical-Dental and Nutrition Information System" />
  <meta name="theme-color" content="#0E2A30" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css" />
  <script>
    // Apply saved theme before first paint to avoid a flash.
    try { const t = localStorage.getItem('kalinga.theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div id="app" aria-live="polite">
    <div class="boot">
      <svg class="pulse" viewBox="0 0 200 40" aria-hidden="true"><path d="M0 20 H70 L80 6 L92 34 L104 12 L112 20 H200" /></svg>
      <p>Loading Kalinga…</p>
    </div>
  </div>
  <div id="toasts" role="status"></div>
  <div id="tooltip" role="tooltip" hidden></div>
  <noscript>Kalinga needs JavaScript enabled to run.</noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
